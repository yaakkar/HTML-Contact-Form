<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&display=swap" rel="stylesheet">
  <style>
    body {
  font-family: "Syne", sans-serif;
  background-color: #cce3ff;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
}
.form-container {
  background-color: white;
  padding: 40px;
  border-radius: 12px;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
  max-width: 600px;
  width: 100%;
}
h2 {
  font-size: 36px;
  font-weight: 700;
  color: #3056d3;
  margin-bottom: 20px;
  text-align: left;
}
.input-group {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}
.input-group input {
  flex: 1;
}
input,
textarea {
  font-size: 14px;
  background-color: #e0e6ff; 
  border: none;
  border-radius: 8px; 
  padding: 12px 15px;
  width: 100%;
  margin-bottom: 15px;
  outline: none;
  box-sizing: border-box;
}
input::placeholder,
textarea::placeholder {
  font-family: "Syne", sans-serif;
  color: #3056d3; 
  opacity: 1;     
} 
textarea {
  resize: none;
  height: 100px;
}
button {
  display: block;        
  width: auto;              
  padding: 12px 40px;      
  margin: 0 auto;           
  background-color: #3056d3;
  color: white;
  font-size: 16px;
  font-weight: bold;
  border: none;
  border-radius: 25px;
  cursor: pointer;
  transition: background-color 0.3s ease;
  text-align: center;
}
button:hover {
  background-color: #1e3bb3;
}
.success-message {
  color: #6cc090;
  text-align: left;
  font-size: 14px;
  margin-top: 10px;
} </style>
  <title>Contact Form</title>
</head>
        <body>
        <div class="form-container">
             <h2>Get In Touch</h2>
                <form class="first-form">
                        <div class="input-group">
                            <input type="text" placeholder="First Name" required>
                            <input type="text" placeholder="Last Name" required>
                        </div>
                            <div class="input-group">
                                <input type="email" placeholder="Email">
                                <input type="tel" placeholder="Phone">
                            </div>
                                <input type="text" placeholder="Address">
                                    <textarea placeholder="Type your message here"></textarea><br>
                                        <button type="submit">Submit</button>
                                            <p class="success-message">Thanks for submitting!</p>
                </form>
       </div>
        </body>
</html>
